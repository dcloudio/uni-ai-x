<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <script>
      window.MathJax = {
        startup: {
          typeset: false
        },
        svg: {
          fontCache: 'local'
        },
        options: {
          enableMenu: false
        }
      };
    </script>
    <script defer src="./libs/mathjax/tex-svg-full.3.2.2.js"></script>
  </head>
  <body>
    <script type="text/javascript" src="./libs/uni.webview.1.5.5.js"></script>
    <script type="text/javascript" src="./libs/mermaid.min.js"></script>
    <script type="text/javascript" src="./libs/highlight.min.js"></script>
    <script type="text/javascript" src="./harmony-svg-workaround.js"></script>

    <script type="text/javascript">
        class ProxyWebHandler {
          setting = {}
          mathRenderQueue = Promise.resolve()
          mermaidRenderQueue = Promise.resolve()
          constructor() {
            mermaid.initialize(this.mermaidConfig('light'));
            // 监听当前 web 初始化完成
            document.addEventListener('DOMContentLoaded', () => {
              this.postMessage({
                action: 'DOMContentLoaded_callback',
                param: {}
              });
            });
          }
          resolveTheme(theme) {
            if (theme === 'dark') return 'dark';
            if (theme === 'light') return 'light';
            return this.setting.theme === 'dark' ? 'dark' : 'light';
          }
          mermaidConfig(theme) {
            const isDark = theme === 'dark';
            return {
              startOnLoad: false,
              securityLevel: 'strict',
              theme: isDark ? 'dark' : 'default',
              themeVariables: isDark ? {
                background: 'transparent',
                primaryColor: '#1f2937',
                primaryTextColor: '#f9fafb',
                primaryBorderColor: '#9ca3af',
                secondaryColor: '#374151',
                tertiaryColor: '#111827',
                lineColor: '#d1d5db',
                textColor: '#f9fafb',
                mainBkg: '#1f2937',
                nodeBorder: '#9ca3af',
                clusterBkg: '#111827',
                clusterBorder: '#6b7280',
                edgeLabelBackground: '#25282c'
              } : {
                background: 'transparent'
              },
              flowchart: {
                htmlLabels: false
              }
            };
          }
          setSetting({ data, requestId }) {
            this.setting = data;
            this.postMessage({
              action: "setSetting_callback_" + requestId,
              param: {}
            });
          }

          svgDataURL(svgText) {
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgText)));
          }

          parseSvgLength(value, em = 16, ex = 8) {
            if (!value) return null;
            const match = value.trim().match(/^([+-]?(?:\d+\.?\d*|\.\d+))(px|em|ex)?$/i);
            if (!match) return null;
            const numberValue = Number(match[1]);
            if (!Number.isFinite(numberValue)) return null;
            const unit = (match[2] || 'px').toLowerCase();
            if (unit === 'em') return numberValue * em;
            if (unit === 'ex') return numberValue * ex;
            return numberValue;
          }

          svgViewBox(svgElement) {
            const values = (svgElement.getAttribute('viewBox') || '')
              .trim()
              .split(/[\s,]+/)
              .map(value => Number(value));
            if (values.length !== 4 || values.some(value => !Number.isFinite(value))) return null;
            if (values[2] <= 0 || values[3] <= 0) return null;
            return values;
          }

          svgNaturalSize(svgElement, em = 16, ex = 8) {
            const viewBox = this.svgViewBox(svgElement);
            let width = this.parseSvgLength(svgElement.getAttribute('width'), em, ex);
            let height = this.parseSvgLength(svgElement.getAttribute('height'), em, ex);
            if (viewBox != null) {
              const ratio = viewBox[2] / viewBox[3];
              if (width == null && height != null) width = height * ratio;
              if (height == null && width != null) height = width / ratio;
              if (width == null && height == null) {
                width = viewBox[2] / 1000 * ex;
                height = viewBox[3] / 1000 * ex;
              }
            }
            return {
              width: Math.max(1, width || 1),
              height: Math.max(1, height || 1)
            };
          }

          normalizeSvg(svgText, options = {}) {
            const normalizedBreaks = svgText.replace(/<br\s*>/gi, '<br/>');
            const documentNode = new DOMParser().parseFromString(normalizedBreaks, 'image/svg+xml');
            if (documentNode.querySelector('parsererror')) throw new Error('SVG 解析失败');
            const svgElement = documentNode.documentElement;
            if (svgElement == null || svgElement.tagName.toLowerCase() !== 'svg') throw new Error('SVG 根节点无效');

            svgElement.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            svgElement.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
            if (options.foreground) svgElement.setAttribute('color', options.foreground);
            if (options.theme) svgElement.setAttribute('data-uni-ai-theme', options.theme);
            documentNode.querySelectorAll('script').forEach(node => node.remove());
            documentNode.querySelectorAll('*').forEach(node => {
              Array.from(node.attributes).forEach(attribute => {
                const attributeName = attribute.name.toLowerCase();
                const attributeValue = attribute.value.trim().toLowerCase();
                if (attributeName.startsWith('on') ||
                    ((attributeName === 'href' || attributeName === 'xlink:href') && attributeValue.startsWith('javascript:'))) {
                  node.removeAttribute(attribute.name);
                  return;
                }
                if (options.foreground && attributeValue === 'currentcolor') {
                  node.setAttribute(attribute.name, options.foreground);
                }
              });
            });

            let viewBox = this.svgViewBox(svgElement);
            const frameAspectRatio = Number(options.frameAspectRatio || 0);
            if (viewBox != null && Number.isFinite(frameAspectRatio) && frameAspectRatio > 0) {
              const contentAspectRatio = viewBox[2] / viewBox[3];
              if (contentAspectRatio < frameAspectRatio) {
                const frameWidth = viewBox[3] * frameAspectRatio;
                viewBox[0] -= (frameWidth - viewBox[2]) / 2;
                viewBox[2] = frameWidth;
              } else if (contentAspectRatio > frameAspectRatio) {
                const frameHeight = viewBox[2] / frameAspectRatio;
                viewBox[1] -= (frameHeight - viewBox[3]) / 2;
                viewBox[3] = frameHeight;
              }
              svgElement.setAttribute('viewBox', viewBox.join(' '));
            }
            const size = this.svgNaturalSize(svgElement, options.em || 16, options.ex || 8);
            if (options.naturalSize === true) {
              svgElement.setAttribute('width', size.width.toFixed(2) + 'px');
              svgElement.setAttribute('height', size.height.toFixed(2) + 'px');
            } else if (viewBox != null) {
              svgElement.setAttribute('width', viewBox[2].toString());
              svgElement.setAttribute('height', viewBox[3].toString());
            }
            window.harmonySvgWorkaround.applyDecodeScale(svgElement, options.rasterScale);
            svgElement.setAttribute('preserveAspectRatio', options.preserveAspectRatio || 'xMidYMid meet');

            if (options.styleText) {
              let defs = svgElement.querySelector('defs');
              if (defs == null) {
                defs = documentNode.createElementNS('http://www.w3.org/2000/svg', 'defs');
                svgElement.insertBefore(defs, svgElement.firstChild);
              }
              const style = documentNode.createElementNS('http://www.w3.org/2000/svg', 'style');
              style.textContent = options.styleText;
              defs.appendChild(style);
            }

            if (options.background) {
              const background = documentNode.createElementNS('http://www.w3.org/2000/svg', 'rect');
              if (viewBox != null) {
                background.setAttribute('x', viewBox[0].toString());
                background.setAttribute('y', viewBox[1].toString());
                background.setAttribute('width', viewBox[2].toString());
                background.setAttribute('height', viewBox[3].toString());
              } else {
                background.setAttribute('x', '0');
                background.setAttribute('y', '0');
                background.setAttribute('width', '100%');
                background.setAttribute('height', '100%');
              }
              background.setAttribute('fill', options.background);
              background.setAttribute('data-uni-ai-background', 'true');
              const defs = svgElement.querySelector('defs');
              if (defs != null && defs.nextSibling != null) {
                svgElement.insertBefore(background, defs.nextSibling);
              } else {
                svgElement.appendChild(background);
                svgElement.insertBefore(background, svgElement.firstChild);
              }
            }

            const serializedElement = window.harmonySvgWorkaround.prepareForDecode(svgElement, options);
            return {
              svgText: new XMLSerializer().serializeToString(serializedElement),
              hasTextElements: serializedElement.querySelector('text') != null,
              width: size.width,
              height: size.height
            };
          }

          async renderMermaid({
            mermaidText,
            theme,
            requestId,
            rasterScale = 1,
            inlineComputedStyles = false,
            normalizeMermaidNodeText = false,
            normalizeMermaidEdgeLabels = false,
            materializeMermaidPointEndMarkers = false,
            iosCoreSvgCompatibility = false,
            harmonyWorkaround = false
          }) {
            const renderTheme = this.resolveTheme(theme);
            const mermaidId = 'mermaid-' + requestId.replace(/[^a-zA-Z0-9_-]/g, '');
            const renderTask = this.mermaidRenderQueue.then(async () => {
              mermaid.initialize(this.mermaidConfig(renderTheme));
              return await mermaid.render(mermaidId, mermaidText);
            }, async () => {
              mermaid.initialize(this.mermaidConfig(renderTheme));
              return await mermaid.render(mermaidId, mermaidText);
            });
            this.mermaidRenderQueue = renderTask.then(() => undefined, () => undefined);
            try {
              const mermaidRenderResult = await renderTask;
              const normalized = this.normalizeSvg(mermaidRenderResult.svg, {
                frameAspectRatio: 5 / 4,
                theme: renderTheme,
                background: renderTheme === 'dark' ? '#25282c' : '#ffffff',
                styleText: 'svg{background:transparent!important}',
                rasterScale,
                inlineComputedStyles,
                normalizeMermaidNodeText,
                normalizeMermaidEdgeLabels,
                materializeMermaidPointEndMarkers,
                iosCoreSvgCompatibility,
                harmonyWorkaround
              });
              const imageDataURL = this.svgDataURL(normalized.svgText);
              this.postMessage({
                action: "renderMermaid_callback_" + requestId,
                param: {
                  imageDataURL,
                  hasTextElements: normalized.hasTextElements,
                  width: normalized.width,
                  height: normalized.height,
                  theme: renderTheme
                }
              });
              return { svg: normalized.svgText, imageDataURL };
            } catch (error) {
              this.postMessage({
                action: "renderMermaid_callback_" + requestId,
                param: {
                  imageDataURL: '',
                  width: 0,
                  height: 0,
                  theme: renderTheme,
                  error: error.message || String(error)
                }
              });
            }
          }


          highlightCodeLine({ language, codeSource, requestId }) {
            try {
              const aliasMap = {
                javascriptReact: 'jsx',
                typescript: 'ts',
                jsonl: 'plaintext',
                'cuda-cpp': 'cpp',
                xsl: 'xml'
              };
              const targetLanguage = aliasMap[language] || language;
              const safeLanguage = hljs.getLanguage(targetLanguage) ? targetLanguage : 'plaintext';
              const result = hljs.highlight(codeSource, {
                language: safeLanguage,
                ignoreIllegals: true
              });
              const container = document.createElement('div');
              container.innerHTML = result.value;
              const tokens = [];
              const pushToken = (text, className) => {
                if (!text || text.length === 0) return;
                tokens.push({ text, className });
              };
              const normalizeClassName = (className) => {
                if (!className) return '';
                const names = className.split(/\s+/).filter(Boolean);
                if (names.includes('hljs-comment')) return 'comment';
                if (names.includes('hljs-string')) return 'string';
                if (names.includes('hljs-number') || names.includes('hljs-literal')) return 'constant';
                if (names.includes('hljs-keyword') || names.includes('hljs-operator')) return 'keyword';
                if (names.includes('hljs-meta')) return 'meta';
                if (names.includes('hljs-built_in') || names.includes('hljs-type') || names.includes('hljs-params')) return 'support';
                if (names.includes('hljs-variable') || names.includes('hljs-template-variable')) return 'variable';
                if (names.includes('hljs-title') || names.includes('hljs-function') || names.includes('function_')) return 'function';
                if (names.includes('hljs-property') || names.includes('hljs-attr') || names.includes('hljs-tag')) return 'entity';
                if (names.includes('hljs-punctuation')) return 'punctuation';
                return '';
              };
              const walkNode = (node, inheritedClassName) => {
                if (node.nodeType === Node.TEXT_NODE) {
                  pushToken(node.textContent || '', inheritedClassName);
                  return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const mergedClassName = normalizeClassName(node.className || '') || inheritedClassName;
                Array.from(node.childNodes).forEach((child) => walkNode(child, mergedClassName));
              };
              Array.from(container.childNodes).forEach((child) => walkNode(child, ''));
              this.postMessage({
                action: "highlightCodeLine_callback_" + requestId,
                param: {
                  tokensJson: JSON.stringify(tokens),
                  errorMsg: ''
                }
              });
            } catch (error) {
              this.postMessage({
                action: "highlightCodeLine_callback_" + requestId,
                param: {
                  tokensJson: '[]',
                  errorMsg: error.message || String(error)
                }
              });
            }
          }

          postMessage({ action, param }) {
            // console.log('web 内部执行了 postMessage', action, param)
            const arg = { action, param }
            // if (isInHarmonyWeb) {
            //   // TODO:解决在鸿蒙端套娃使用 webview 套 webview 时，无法使用 uni.webView.postMessage 的问题
            //   window.parent.postMessage({ data: { arg, name: 'postMessage' }}, '*');
            // } else {
              uni.webView.postMessage({data: arg});
            // }
          }

          onMessage(param) {
            // console.log('web.onMessage收到', param);
            try {
              param = JSON.parse(decodeURIComponent(param));
            } catch (error) {
              console.log('error', error, decodeURIComponent(param));
            }
            // console.log('web 内部执行了 onMessage', param);
            const { action } = param;

            if (typeof this[action] !== 'function') {
              console.error('不支持的 e.action', action);
              throw new Error('不支持的 e.action: ' + action);
            }

            try {
              this[action](param);
            } catch (error) {
              this.postMessage({
                action: `${action}_callback_${param.requestId}`,
                param: {
                  imageDataURL: '',
                  error: error.message
                }
              });
              console.log(action + '方法执行失败', error);
            }
          }
          async createMathSvg(pureMathText, theme, rasterScale = 1) {
            if (window.MathJax == null) throw new Error('MathJax 未加载');
            await window.MathJax.startup.promise;
            const mathNode = await window.MathJax.tex2svgPromise(pureMathText, {
              display: true,
              em: 16,
              ex: 8,
              containerWidth: Math.max(320, window.innerWidth || 320)
            });
            const svgElement = mathNode.querySelector('svg');
            if (svgElement == null) throw new Error('MathJax 未生成 SVG');
            const isDark = theme === 'dark';
            const foreground = isDark ? '#ffffff' : '#25282c';
            return this.normalizeSvg(svgElement.outerHTML, {
              foreground,
              theme,
              naturalSize: true,
              preserveAspectRatio: 'xMinYMid meet',
              em: 16,
              ex: 8,
              rasterScale,
              styleText: [
                'svg{background:transparent!important;color:' + foreground + '}',
                'svg a{fill:#0066cc;stroke:#0066cc}',
                '[data-mml-node="merror"]>g{fill:#cc0000;stroke:#cc0000}',
                '[data-mml-node="merror"]>rect[data-background]{fill:#ffff88;stroke:none}',
                '[data-frame],[data-line]{stroke-width:70px;fill:none}',
                '.mjx-dashed{stroke-dasharray:140}',
                '.mjx-dotted{stroke-linecap:round;stroke-dasharray:0,140}',
                'use[data-c]{stroke-width:3px}'
              ].join('')
            });
          }

          async mathSvgRender({ pureMathText, theme, requestId, rasterScale = 1 }) {
            const renderTheme = this.resolveTheme(theme);
            const renderTask = this.mathRenderQueue.then(
              () => this.createMathSvg(pureMathText, renderTheme, rasterScale),
              () => this.createMathSvg(pureMathText, renderTheme, rasterScale)
            );
            this.mathRenderQueue = renderTask.then(() => undefined, () => undefined);
            const param = {
              imageDataURL: '',
              hasTextElements: false,
              width: null,
              height: null,
              theme: renderTheme,
              error: ''
            };
            try {
              const normalized = await renderTask;
              param.imageDataURL = this.svgDataURL(normalized.svgText);
              param.hasTextElements = normalized.hasTextElements;
              param.width = normalized.width;
              param.height = normalized.height;
            } catch (error) {
              param.error = error.message || String(error);
            }
            this.postMessage({
              action: "mathSvgRender_callback_" + requestId,
              param
            });
          }
        }

        // 实例化并挂载到 window，方便外部调用 onMessage 等
        window.proxyWebHandler = new ProxyWebHandler();
        // 兼容原有全局 onMessage 调用方式
        window.onMessage = (...args) => window.proxyWebHandler.onMessage(...args);
    </script>
  </body>
</html>
